<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบตรวจจับอุณหภูมิและควัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Noto+Sans+Thai:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #01323f center / cover no-repeat; }

  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    background: center / 100% 100% no-repeat;
    transform-origin: center center; transform: translate(-50%, -50%) scale(1);
    user-select: none; -webkit-user-select: none;
    font-family: "Poppins", "Noto Sans Thai", "Arial Black", sans-serif; font-weight: 700;
  }

  /* กล่องแสดงค่า (ตรงกับกล่องในรูปพื้นหลัง) */
  .card { position: absolute; top: 357px; width: 323px; height: 323px; color: #fff; text-align: center; pointer-events: none; }
  .card .name { position: absolute; top: 26px; width: 100%; font-size: 26px; letter-spacing: 3px; color: rgba(255,255,255,.6); }
  .card .value { position: absolute; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 104px; line-height: 1; transition: color .3s; }
  .card .unit { position: absolute; bottom: 30px; width: 100%; font-size: 40px; color: #8fb8c4; }
  .value.warn   { color: #ffc233; }
  .value.danger { color: #ff5a4d; animation: blink .6s steps(2, jump-none) infinite; }
  .value.off    { color: rgba(255,255,255,.25); }
  @keyframes blink { 50% { opacity: .35; } }
  #c0 { left: 488px; } #c1 { left: 1012px; }

  /* แถบสถานะ */
  #status {
    position: absolute; left: 611px; top: 268px; width: 600px; height: 62px; border-radius: 31px;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    background: #1b8a5a; color: #fff; border: 4px solid #fff; transition: background .3s; pointer-events: none;
  }
  #status.warn    { background: #f2a900; color: #1d1d1d; }
  #status.danger  { background: #d32f2f; animation: blink .6s steps(2, jump-none) infinite; }
  #status.offline { background: #5f7480; }

  /* ปุ่ม toggle (ปิดทับปุ่มเดิมในรูป) */
  .toggle { position: absolute; top: 696px; height: 114px; width: 300px; border-radius: 57px; background: #737373; cursor: pointer; touch-action: none; outline: none; }
  .toggle:focus-visible { box-shadow: 0 0 0 4px rgba(255,255,255,.8); }
  #t0 { left: 500px; } #t1 { left: 1036px; }
  .knob { position: absolute; top: 0; left: 0; width: 114px; height: 114px; border-radius: 50%; background: #30717e; border: 7px solid #013040; transition: left .22s ease, background .22s; }
  .toggle[data-on="1"] .knob { background: #3fb6a8; }
  .toggle.dragging .knob { transition: none; }
  .lbl { position: absolute; top: 0; height: 114px; line-height: 114px; text-align: center; font-size: 34px; color: #fff; pointer-events: none; transition: left .22s ease; }

  /* แผงควบคุมมุมซ้ายบน */
  #ctrl { position: absolute; left: 36px; top: 28px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  #ctrl button { font: 700 24px "Noto Sans Thai", sans-serif; padding: 10px 22px; border-radius: 30px; cursor: pointer; border: 3px solid #fff; background: rgba(0,0,0,.4); color: #fff; }
  #ctrl button.on { background: #d32f2f; }
  #src { font: 700 20px "Noto Sans Thai", sans-serif; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.6); padding-left: 6px; }

  /* ขอบจอสีแดงเมื่ออันตราย */
  #alert { position: fixed; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 180px 40px #ff1a1a; transition: opacity .3s; }
  #alert.on { opacity: 1; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

<body>

<div id="stage">
  <div id="ctrl">
    <button id="fire" type="button">🔥 จำลองไฟไหม้</button>
    <button id="snd" type="button">🔕 เสียงเตือน: ปิด</button>
    <div id="src"></div>
  </div>

  <div id="status">ปกติ • NORMAL</div>

  <div class="card" id="c0"><div class="name">TEMPERATURE</div><div class="value" id="v0">--</div><div class="unit">°C</div></div>
  <div class="card" id="c1"><div class="name">SMOKE</div><div class="value" id="v1">--</div><div class="unit">PPM</div></div>

  <div class="toggle" id="t0" role="switch" aria-checked="true" aria-label="เซ็นเซอร์อุณหภูมิ" title="เปิด/ปิดเซ็นเซอร์อุณหภูมิ" tabindex="0"><span class="lbl"></span><div class="knob"></div></div>
  <div class="toggle" id="t1" role="switch" aria-checked="true" aria-label="เซ็นเซอร์ควัน" title="เปิด/ปิดเซ็นเซอร์ควัน" tabindex="0"><span class="lbl"></span><div class="knob"></div></div>
</div>
<div id="alert"></div>

<script>
(function () {
  /* ================= ตั้งค่าระบบ ================= */
  var CFG = {
    source: "sim",        // "sim" = ข้อมูลจำลอง | "http" = ดึงจากเซ็นเซอร์จริง
    url: "",              // เช่น "http://192.168.1.50/data"  ต้องตอบ JSON: {"temp":28.5,"smoke":120}
    intervalMs: 1000,     // อ่านค่าทุกกี่มิลลิวินาที
    temp:  { warn: 40,  danger: 55  },   // °C
    smoke: { warn: 300, danger: 600 }    // PPM
  };

  /* ================= ย่อ/ขยายให้เต็มจอ ================= */
  var stage = document.getElementById("stage");
  function fit() {
    var s = Math.max(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();

  /* ================= ข้อมูล ================= */
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  var data = { temp: rnd(24, 32), smoke: rnd(10, 50) };      // เริ่มด้วยค่าสุ่ม
  var enabled = [true, true];
  var alarmOn = false, fire = false, offline = false, dangerNow = false;

  function simStep() {
    var k = fire ? 1 : 0;
    data.temp  += ((k ? 75 : 28) - data.temp)   * (k ? .08 : .15) + (Math.random() - .5) * (k ? 1.5 : .8);
    data.smoke += ((k ? 900 : 30) - data.smoke) * (k ? .12 : .20) + (Math.random() - .5) * (k ? 40 : 8);
    data.temp = clamp(data.temp, 0, 120); data.smoke = clamp(data.smoke, 0, 1000);
  }
  function pull() {
    if (CFG.source === "sim") { simStep(); render(); return; }
    fetch(CFG.url, { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (d) { offline = false; window.updateSensors(d); })
      .catch(function () { offline = true; render(); });
  }
  // ส่งค่าจากภายนอกได้: updateSensors({temp:30, smoke:100})
  window.updateSensors = function (d) {
    if (d.temp != null) data.temp = +d.temp;
    if (d.smoke != null) data.smoke = +d.smoke;
    render();
  };

  /* ================= แสดงผล ================= */
  var $ = function (id) { return document.getElementById(id); };
  var v = [$("v0"), $("v1")];
  function lv(val, c) { return val >= c.danger ? 2 : val >= c.warn ? 1 : 0; }
  function cls(l) { return l === 2 ? "danger" : l === 1 ? "warn" : ""; }

  function render() {
    var lt = enabled[0] ? lv(data.temp, CFG.temp) : 0;
    var ls = enabled[1] ? lv(data.smoke, CFG.smoke) : 0;
    var all = Math.max(lt, ls);
    v[0].textContent = enabled[0] ? data.temp.toFixed(1) : "--";
    v[1].textContent = enabled[1] ? Math.round(data.smoke) : "--";
    v[0].className = "value " + (enabled[0] ? cls(lt) : "off");
    v[1].className = "value " + (enabled[1] ? cls(ls) : "off");

    var st = $("status"), al = $("alert");
    al.className = "";
    if (offline)                         { st.className = "offline"; st.textContent = "ไม่พบเซ็นเซอร์ • OFFLINE"; }
    else if (!enabled[0] && !enabled[1]) { st.className = "offline"; st.textContent = "ปิดเซ็นเซอร์ทั้งหมด • SENSORS OFF"; }
    else if (all === 2) { st.className = "danger"; st.textContent = "อันตราย! ตรวจพบไฟไหม้ • DANGER"; al.className = "on"; }
    else if (all === 1) { st.className = "warn";   st.textContent = "เฝ้าระวัง • WARNING"; }
    else                { st.className = "";       st.textContent = "ปกติ • NORMAL"; }
    dangerNow = !offline && all === 2;
  }

  /* ================= เสียงเตือน ================= */
  var actx = null;
  function beep() {
    if (!alarmOn || !dangerNow || !actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = 880; g.gain.value = .12;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + .25);
  }
  setInterval(beep, 600);
  $("snd").addEventListener("click", function () {
    alarmOn = !alarmOn;
    if (alarmOn && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (alarmOn && actx && actx.state === "suspended") actx.resume();
    this.classList.toggle("on", alarmOn);
    this.textContent = alarmOn ? "🔔 เสียงเตือน: เปิด" : "🔕 เสียงเตือน: ปิด";
    if (alarmOn) beep();
  });

  /* ================= ปุ่ม toggle (คลิก / ลาก / Space / Enter) ================= */
  var KNOB = 114;
  function setState(tg, on, idx, silent) {
    var knob = tg.querySelector(".knob"), lbl = tg.querySelector(".lbl"), w = tg.offsetWidth;
    tg.setAttribute("aria-checked", on ? "true" : "false");
    tg.dataset.on = on ? "1" : "0";
    knob.style.left = (on ? w - KNOB : 0) + "px";
    lbl.style.width = (w - KNOB) + "px";
    lbl.style.left = (on ? 0 : KNOB) + "px";
    lbl.textContent = on ? "ON" : "OFF";
    if (silent) return;
    enabled[idx] = on; render();
  }
  Array.prototype.forEach.call(document.querySelectorAll(".toggle"), function (tg, idx) {
    var knob = tg.querySelector(".knob");
    var dragging = false, moved = false, startX = 0, startLeft = 0;
    function sc() { return tg.getBoundingClientRect().width / tg.offsetWidth || 1; }
    tg.addEventListener("pointerdown", function (e) {
      dragging = true; moved = false; startX = e.clientX; startLeft = parseFloat(knob.style.left) || 0;
      tg.classList.add("dragging"); tg.setPointerCapture(e.pointerId);
    });
    tg.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var dx = (e.clientX - startX) / sc();
      if (Math.abs(dx) > 4) moved = true;
      knob.style.left = clamp(startLeft + dx, 0, tg.offsetWidth - KNOB) + "px";
    });
    function end() {
      if (!dragging) return;
      dragging = false; tg.classList.remove("dragging");
      var on = moved ? (parseFloat(knob.style.left) || 0) > (tg.offsetWidth - KNOB) / 2 : tg.dataset.on !== "1";
      setState(tg, on, idx);
    }
    tg.addEventListener("pointerup", end);
    tg.addEventListener("pointercancel", end);
    tg.addEventListener("keydown", function (e) {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); setState(tg, tg.dataset.on !== "1", idx); }
    });
    setState(tg, true, idx, true);      // เริ่มต้นเปิดทั้งสองเซ็นเซอร์
  });

  /* ================= ปุ่มจำลองไฟไหม้ + เริ่มทำงาน ================= */
  var fb = $("fire");
  if (CFG.source !== "sim") fb.style.display = "none";
  $("src").textContent = CFG.source === "sim" ? "โหมดข้อมูล: จำลอง (Simulation)" : "โหมดข้อมูล: เซ็นเซอร์จริง";
  fb.addEventListener("click", function () {
    fire = !fire; fb.classList.toggle("on", fire);
    fb.textContent = fire ? "✅ หยุดจำลอง" : "🔥 จำลองไฟไหม้";
  });

  render();
  setInterval(pull, CFG.intervalMs);
})();
</script>
</body>
</html>
